spring.application.name=sublime-app

# === DataSource (MySQL via Docker, porta 3307) ===
spring.datasource.url=jdbc:mysql://localhost:3307/sublime_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
# validate: o Hibernate só CONFERE se as entidades batem com o banco (não cria nem
# altera tabelas). Quem cria e muda o schema é o Flyway (ver docs/development.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === Flyway ===
# Migrations em src/main/resources/db/migration (V1__..., V2__...), aplicadas ao subir
# a aplicação. Migration aplicada nunca é editada: mudança nova = arquivo novo.
spring.flyway.enabled=true

# === Swagger API ===
# Para acessar: localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
