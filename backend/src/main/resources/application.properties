spring.application.name=sublime-app

# === Variáveis locais ===
# Lê o backend/.env (fora do git; modelo em backend/.env.example) com JWT_SECRET,
# ADMIN_EMAIL e ADMIN_PASSWORD. "optional": sem o arquivo, a aplicação usa as variáveis
# de ambiente do sistema (como num servidor). Caminho relativo à pasta de onde a
# aplicação é iniciada: rode a partir de backend/.
spring.config.import=optional:file:.env[.properties]

# === DataSource (MySQL via Docker, porta 3307) ===
spring.datasource.url=jdbc:mysql://localhost:3307/sublime_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
# validate: o Hibernate só CONFERE se as entidades batem com o banco (não cria nem
# altera tabelas). Quem cria e muda o schema é o Flyway (ver docs/development.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === Flyway ===
# Migrations em src/main/resources/db/migration (V1__..., V2__...), aplicadas ao subir
# a aplicação. Migration aplicada nunca é editada: mudança nova = arquivo novo.
spring.flyway.enabled=true

# === Autenticação (JWT) ===
# Segredo da assinatura do token: só pela variável de ambiente JWT_SECRET (mínimo de 32
# caracteres), nunca no git. Sem ela a aplicação não sobe (ver docs/development.md).
jwt.secret=${JWT_SECRET}
# Validade do token: um expediente, sem refresh token
jwt.expiration=8h
# Primeiro admin: criado ao subir só se não existir nenhum ADMIN ativo. Opcionais (vazias =
# nenhum admin é criado e um aviso sai no log).
sublime.admin.email=${ADMIN_EMAIL:}
sublime.admin.password=${ADMIN_PASSWORD:}

# === Swagger API ===
# Para acessar: localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
