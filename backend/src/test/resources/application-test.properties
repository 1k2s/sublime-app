# Perfil dos testes de integração (ativado pela @IntegrationTest; ver o ADR 0036).
# O datasource vem do container do Testcontainers (@ServiceConnection), não daqui.
# Valores fixos: os testes não dependem do backend/.env, e rodam igual no CI.

# Segredo só de teste (mínimo de 32 caracteres), sem valor real
jwt.secret=segredo-somente-para-testes-automatizados-0123456789

# Admin padrão do banco de teste, criado na subida pelo AdminInitializer
sublime.admin.email=admin@sublime.test
sublime.admin.password=senha-admin-teste

spring.jpa.show-sql=false
